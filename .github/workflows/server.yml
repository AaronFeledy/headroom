name: Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -skip 'CodexResetEndpoint|ClaudeResetEndpoint|ConsumeResetCredit' ./...
      - name: Build packages
        run: go build ./...

  artifacts:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            output: usage-server-win-x64.exe
            asset: usage-server-win-x64.exe
          - os: linux
            arch: amd64
            output: usage-server-linux-amd64
            asset: usage-server-linux-amd64
          - os: linux
            arch: arm64
            output: usage-server-linux-arm64
            asset: usage-server-linux-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum
      - name: Build usage-server
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags='-s -w -buildid=' -o "${{ runner.temp }}/${{ matrix.output }}" ./cmd/usage-server
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker multi-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          tags: usage-server:ci
          cache-from: type=gha,scope=usage-server
          cache-to: type=gha,scope=usage-server,mode=max
