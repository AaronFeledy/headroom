name: Stream Deck

on:
  push:
    branches: [main]
    paths:
      - 'clients/streamdeck/**'
      - 'clients/desktop/headroom.svg'
      - 'clients/shared/provider-icons/**'
      - 'server/internal/usage/testdata/*.json'
      - '.github/workflows/streamdeck.yml'
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - 'clients/streamdeck/**'
      - 'clients/desktop/headroom.svg'
      - 'clients/shared/provider-icons/**'
      - 'server/internal/usage/testdata/*.json'
      - '.github/workflows/streamdeck.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    defaults:
      run:
        working-directory: clients/streamdeck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/streamdeck/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Build plugin
        run: npm run build -- --version 0.1.0+ci.${{ github.run_number }}.${{ github.run_attempt }}
      - run: npm test
      - run: npm run validate
      - run: npm run pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'windows-latest'
        with:
          name: headroom-streamdeck
          path: clients/streamdeck/dist/*.streamDeckPlugin
          if-no-files-found: error
