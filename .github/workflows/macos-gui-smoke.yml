name: Mac GUI smoke

on:
  workflow_dispatch:
    inputs:
      source:
        description: Install Headroom from the latest published release via install.sh
        type: choice
        default: latest-release
        options:
          - latest-release
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macos-gui-smoke.yml'
      - 'packaging/tests/macos_gui_evidence.py'
      - 'packaging/tests/macos_package_smoke.py'
      - 'packaging/tests/macos_finder_smoke.py'
      - 'packaging/tests/test_macos_gui_evidence.py'
      - 'install.sh'

permissions:
  contents: read

jobs:
  macos-gui-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, architecture: x86_64}
          - {runner: macos-15, architecture: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the latest published release the way users do
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/mac-home"
          HOME="$RUNNER_TEMP/mac-home" ./install.sh --no-launch
      - name: Launch the installed GUI and capture screenshots
        timeout-minutes: 5
        run: >-
          python3 packaging/tests/macos_package_smoke.py
          --from-home "$RUNNER_TEMP/mac-home"
          --work "$RUNNER_TEMP/macos-gui-smoke"
          --arch "${{ matrix.architecture }}"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: headroom-macos-${{ matrix.architecture }}-release-gui-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/macos-gui-smoke/headroom-macos*.png
            ${{ runner.temp }}/macos-gui-smoke/macos-gui-evidence.json
            ${{ runner.temp }}/macos-gui-smoke/*-inventory.txt
